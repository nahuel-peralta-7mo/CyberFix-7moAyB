<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Stock - Sistema Celulares</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style-main_stk_accesorios.css">
</head>
<body>

    <!-- Contenedor principal de ancho fijo centrado -->
    <div class="contenedor-principal">
        
        <!-- SECCIÓN DE ENCABEZADO -->
        <header class="encabezado">
            <div>
                <h1 class="titulo-principal">Gestión de Stock: Accesorios y Repuestos</h1>
            </div>
            <div>
                <button onclick="abrirModal()" class="boton boton-primario">
                    + Agregar Producto
                </button>
            </div>
        </header>

        <!-- SECCIÓN DE BÚSQUEDA RÁPIDA -->
        <div class="seccion-busqueda">
            <input type="text" id="entradaBusqueda" oninput="filtrarProductos()" placeholder="Buscar accesorio, repuesto, categoría o marca..." class="input-busqueda">
        </div>

        <!-- SECCIÓN DE LA TABLA DE INVENTARIO -->
        <div class="contenedor-tabla">
            <table class="tabla">
                <thead>
                    <tr class="tabla-header">
                        <th class="celda">Producto / Repuesto</th>
                        <th class="celda">Categoría</th>
                        <th class="celda">Stock</th>
                        <th class="celda">Precio</th>
                        <th class="celda texto-centro">Acciones</th>
                    </tr>
                </thead>
                <tbody id="cuerpoTablaProductos" class="tabla-cuerpo">
                    <!-- Ejemplo visual estático -->
                    <tr class="fila-tabla">
                        <td class="celda fuente-media">Módulo Original Samsung A12</td>
                        <td class="celda texto-gris">Repuestos</td>
                        <td class="celda texto-verde">4</td>
                        <td class="celda">$45.000</td>
                        <td class="celda texto-centro">
                            <button class="btn-accion btn-editar">Editar</button>
                            <button class="btn-accion btn-eliminar">Eliminar</button>
                        </td>
                    </tr>
                    <tr class="fila-tabla">
                        <td class="celda fuente-media">Funda Anti-golpes iPhone 13</td>
                        <td class="celda texto-gris">Accesorios</td>
                        <td class="celda texto-verde">12</td>
                        <td class="celda">$8.500</td>
                        <td class="celda texto-centro">
                            <button class="btn-accion btn-editar">Editar</button>
                            <button class="btn-accion btn-eliminar">Eliminar</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- VENTANA MODAL -->
    <div id="modalProducto" class="modal oculto">
        <div class="modal-contenido">
            <h2 class="modal-titulo">Nuevo Producto / Repuesto</h2>
            
            <form id="formularioProducto" onsubmit="guardarProducto(event)">
                <input type="hidden" id="idProducto">
                
                <div class="form-grupo">
                    <div class="campo">
                        <label class="label">Nombre del Producto / Repuesto</label>
                        <input type="text" id="nombre" required class="input-form">
                    </div>
                    <div class="campo">
                        <label class="label">Categoría (Ej: Accesorios, Repuestos)</label>
                        <input type="text" id="categoria" required class="input-form">
                    </div>
                    <div class="campo">
                        <label class="label">Marca / Compatibilidad</label>
                        <input type="text" id="marca" required class="input-form">
                    </div>
                    <div class="grid-2">
                        <div class="campo">
                            <label class="label">Stock</label>
                            <input type="number" id="stock" min="0" required class="input-form">
                        </div>
                        <div class="campo">
                            <label class="label">Precio</label>
                            <input type="number" step="0.01" id="precio" min="0" required class="input-form">
                        </div>
                    </div>
                </div>

                <div class="modal-botones">
                    <button type="button" onclick="cerrarModal()" class="boton boton-secundario">Cancelar</button>
                    <button type="submit" class="boton boton-primario">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
