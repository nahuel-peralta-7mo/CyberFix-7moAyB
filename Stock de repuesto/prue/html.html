<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css.css">
    <title>Document</title>
</head>

<body>
    <div>
        <button class="boton agregarProducto">
            + Agregar Producto
        </button>
    </div>

    <!-- VENTANA MODAL -->
    <div id="agregarProducto" class="modal oculto" aria-hidden="true">
        <div class="modal-contenido">
            <h2 class="modal-titulo">Nuevo Producto / Repuesto</h2>

            <form id="formularioProducto" onsubmit="guardarProducto(event)">
                <input type="hidden" id="idProducto">

                <div class="form-grupo">
                    <div class="campo">
                        <label for="nombre" class="label">Nombre del Producto / Repuesto</label>
                        <input type="text" id="nombre" required class="input-form">
                    </div>
                    <div class="campo">
                        <label for="categoria" class="label">Categoría (Ej: Accesorios, Repuestos)</label>
                        <input type="text" id="categoria" required class="input-form">
                    </div>
                    <div class="campo">
                        <label for="marca" class="label">Marca / Compatibilidad</label>
                        <input type="text" id="marca" required class="input-form">
                    </div>
                    <div class="grid-2">
                        <div class="campo">
                            <label for="stock" class="label">Stock</label>
                            <input type="number" id="stock" min="0" required class="input-form">
                        </div>
                        <div class="campo">
                            <label for="precio" class="label">Precio</label>
                            <input type="number" step="0.01" id="precio" min="0" required class="input-form">
                        </div>
                    </div>
                </div>

                <div class="modal-botones">
                    <button type="button" onclick="cerrarModal()" class="boton boton-secundario">Cancelar</button>
                    <button type="submit" class="boton boton-primario">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="./js.js"></script>
</body>

</html>
