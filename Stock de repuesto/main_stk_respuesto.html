<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Gestión de Stock</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style-main_stok_respuesto.css">
</head>

<body>

    <!-- CONTENEDOR GENERAL DE DOS COLUMNAS -->
    <div class="layout-dashboard">

        <!-- 1. MENÚ LATERAL FIJO (VERTICAL) -->
        <aside class="sidebar-fijo">
            <div class="sidebar-logo">
                <h2>Sistema Taller</h2>
                <span class="sidebar-sub">Panel de Control</span>
            </div>

            <nav class="sidebar-nav">
                <a href="../Punto de venta/main_puento_venta.html" class="sidebar-link"> Punto de venta</a>
                <a href="../Stock de accesorios/main_stk_accesorios.html" class="sidebar-link"> Stock de accesorios</a>
                <a href="../Equipo a reparar/main_equipo_reparar.html" class="sidebar-link"> Equipo a reparar</a>
                <a href="../Ver historial de ventas/main-historial.html" class="sidebar-link"> Historial</a>
                <a href="../main.html" class="sidebar-link">← Volver al Menú</a>
            </nav>
        </aside>

        <!-- 2. CONTENEDOR PRINCIPAL DE LA VISTA -->
        <main class="contenedor-principal">

            <!-- SECCIÓN DE ENCABEZADO -->
            <header class="encabezado">
                <div>
                    <button class="boton agregarRespuesto" type="button">
                        + Agregar Respuesto
                    </button>
                </div>
            </header>
            <!-- SECCIÓN DE BÚSQUEDA RÁPIDA -->
            <div class="seccion-busqueda">
                <input type="text" id="entradaBusqueda" oninput="filtrarRespuestos()"
                    placeholder="Buscar accesorio, repuesto, categoría o marca..." class="input-busqueda">
            </div>

            <!-- SECCIÓN DE LA TABLA DE INVENTARIO -->
            <div class="contenedor-tabla">
                <table class="tabla">
                    <thead>
                        <tr class="tabla-header">
                            <th class="celda">Respuesto / Repuesto</th>
                            <th class="celda">Categoría</th>
                            <th class="celda">Stock</th>
                            <th class="celda">Precio</th>
                            <th class="celda texto-centro">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTablaRespuestos" class="tabla-cuerpo">
                        <!-- Fila 1 -->
                        <tr class="fila-tabla">
                            <td class="celda fuente-media">Módulo Original Samsung A12</td>
                            <td class="celda texto-gris">Repuestos</td>
                            <td class="celda texto-verde">4</td>
                            <td class="celda">$45.000</td>
                            <td class="celda texto-centro">
                                <div class="menu-acciones">
                                    <button class="btn-tres-puntos" onclick="toggleMenu(event)">⋮</button>
                                    <div class="menu-desplegable oculto">
                                        <button class="opcion-menu" onclick="editarRespuesto(1)">Editar</button>
                                        <button class="opcion-menu eliminar"
                                            onclick="eliminarRespuesto(1)">Eliminar</button>
                                    </div>
                                </div>
                            </td>
                        </tr>
                        <!-- Fila 2 -->
                        <tr class="fila-tabla">
                            <td class="celda fuente-media">Funda Anti-golpes iPhone 13</td>
                            <td class="celda texto-gris">Accesorios</td>
                            <td class="celda texto-verde">12</td>
                            <td class="celda">$8.500</td>
                            <td class="celda texto-centro">
                                <div class="menu-acciones">
                                    <button class="btn-tres-puntos" onclick="toggleMenu(event)">⋮</button>
                                    <div class="menu-desplegable oculto">
                                        <button class="opcion-menu" onclick="editarRespuesto(2)">Editar</button>
                                        <button class="opcion-menu eliminar"
                                            onclick="eliminarRespuesto(2)">Eliminar</button>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- VENTANA MODAL -->
    <div id="agregarRespuesto" class="modal oculto" aria-hidden="true">
        <div class="modal-contenido">
            <h2 class="modal-titulo">Nuevo Respuesto / Repuesto</h2>

            <form id="formularioRespuesto" onsubmit="guardarRespuesto(event)">
                <input type="hidden" id="idRespuesto">

                <div class="form-grupo">
                    <div class="campo">
                        <label for="nombre" class="label">Nombre del Respuesto / Repuesto</label>
                        <input type="text" id="nombre" required class="input-form">
                    </div>
                    <div class="campo">
                        <label for="categoria" class="label">Categoría (Ej: Accesorios, Repuestos)</label>
                        <input type="text" id="categoria" required class="input-form">
                    </div>
                    <div class="campo">
                        <label for="marca" class="label">Marca / Compatibilidad</label>
                        <input type="text" id="marca" required class="input-form">
                    </div>
                    <div class="grid-2">
                        <div class="campo">
                            <label for="stock" class="label">Stock</label>
                            <input type="number" id="stock" min="0" required class="input-form">
                        </div>
                        <div class="campo">
                            <label for="precio" class="label">Precio</label>
                            <input type="number" step="0.01" id="precio" min="0" required class="input-form">
                        </div>
                    </div>
                </div>

                <div class="modal-botones">
                    <button type="button" onclick="cerrarModal()" class="boton boton-secundario">Cancelar</button>
                    <button type="submit" class="boton boton-primario">Guardar</button>
                </div>
            </form>
        </div>
    </div>


    <script src="./JS/JS_main_stock_respuesto.js"></script>
</body>

</html>
